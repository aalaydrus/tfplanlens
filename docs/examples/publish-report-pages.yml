# Example: publish a tfplanlens HTML report to GitHub Pages (opt-in, copy and adapt).
# Read docs/PAGES.md first: a Pages site is public unless your plan restricts it.
name: Publish plan report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin to a commit SHA in your repo
      - uses: actions/setup-go@v5 # pin to a commit SHA in your repo
        with:
          go-version: "1.23"

      # Replace with your own steps that produce plan.json
      # (terraform init && terraform plan -out=tfplan && terraform show -json tfplan > plan.json).
      - name: Create plan.json
        run: echo "replace me with your terraform plan steps" && exit 1

      - name: Render the report
        run: |
          go install github.com/aalaydrus/tfplanlens/cmd/tfplanlens@main # pin a release tag once one exists
          mkdir site
          "$(go env GOPATH)/bin/tfplanlens" report plan.json -f html -o site/index.html

      - uses: actions/upload-pages-artifact@v3 # pin to a commit SHA in your repo
        with:
          path: site

  deploy:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4 # pin to a commit SHA in your repo

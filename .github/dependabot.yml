# Keeps the pinned GitHub Actions (commit SHAs, see .github/workflows) and the
# Go modules current: Dependabot opens a pull request when a new version is
# out. Review the diff of the pinned action before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Newer golang.org/x/* releases require a newer Go, and `go mod tidy` then
    # raises the `go` line in go.mod (a bump of x/net and x/term took it from
    # 1.23.0 to 1.26.0, the minimum is now 1.25.0), which would stop anyone with an older Go from building
    # tfplanlens. Only patch releases of x/* are proposed. To move the minimum
    # Go version on purpose, bump `go` in go.mod yourself and drop this rule.
    # Ignore rules do not apply to Dependabot security updates, and a bump can
    # still raise `go` in go.mod: TestGoModKeepsTheMinimumGoVersion then fails CI,
    # so such a PR is red instead of quietly mergeable.
    ignore:
      - dependency-name: "golang.org/x/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      go-modules:
        patterns: ["*"]

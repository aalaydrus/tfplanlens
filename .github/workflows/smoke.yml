name: Smoke test (real plans)

# Runs tfplanlens against REAL Terraform plans (built-in terraform_data
# resources only: no providers, no cloud credentials), renders every output
# format, takes screenshots, and reports the results on the pull request.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "testdata/real/**"
      - ".github/workflows/smoke.yml"
      - "scripts/smoke-*.sh"
      - "scripts/screenshot.mjs"

permissions:
  contents: read
  pull-requests: write # to post the report comments on the pull request

jobs:
  smoke:
    runs-on: ubuntu-latest
    # floci: a local AWS emulator, so the aws-assume-role scenario can run the
    # real AWS provider (with assume_role) without any AWS credentials. It only
    # needs the Docker socket for services we do not use, but probes it at start.
    services:
      floci:
        image: floci/floci:2.2.0
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        options: --user root
    env:
      # Pull requests from forks get a read-only token: skip the PR comments.
      CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - name: Versions
        run: |
          terraform version
          go version

      - name: Build tfplanlens
        run: go build -o tfplanlens ./cmd/tfplanlens

      - name: Wait for floci
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/4566) 2>/dev/null; then echo "floci is up"; exit 0; fi
            sleep 2
          done
          echo "floci did not start on :4566" >&2
          exit 1

      - name: Generate real plans
        run: |
          set -eu
          # Every scenario directory under testdata/real. Most use only the
          # built-in terraform_data resource; some also install the
          # credential-free hashicorp/local provider, and aws-assume-role runs
          # the real AWS provider against floci.
          for dir in testdata/real/*/; do
            scripts/smoke-plan.sh "$(basename "$dir")" "$RUNNER_TEMP/work"
          done
          ls -la testdata/plans/real

      - name: Render every format
        run: |
          set -eu
          for plan in testdata/plans/real/*.json; do
            scenario=$(basename "$plan" | sed 's/-tf.*//')
            scripts/smoke-report.sh "$scenario" "$plan"
          done
          find docs/smoke -type f | sort

      - name: Plan diff of the rereview pair
        run: |
          set -eu
          # Two real plans of the same state (see scripts/smoke-plan.sh, v3). Each
          # run writes plans named after the newest Terraform next to the committed
          # ones, so take the newest of each: two names would be two arguments.
          before=$(ls testdata/plans/real/rereview-tf*.json | sort -V | tail -1)
          after=$(ls testdata/plans/real/rereview-after-tf*.json | sort -V | tail -1)
          mkdir -p docs/smoke/rereview-diff
          for spec in text:txt markdown:md json:json; do
            ./tfplanlens diff "$before" "$after" --format "${spec%%:*}" \
              --tfapply-account-id=111111111111 --out "docs/smoke/rereview-diff/diff.${spec##*:}" </dev/null
          done
          cat docs/smoke/rereview-diff/diff.txt

      - name: Test against the freshly generated plans
        run: |
          set -eu
          # The Go tests assert on addresses, actions and counts (never on bytes:
          # resource ids differ on every run), so they must hold for whatever the
          # newest Terraform produced. The fresh plans sit next to the committed ones.
          go test ./cmd/tfplanlens -run 'TestReal|TestJSONArraysAreNeverNull|TestRedactionLeavesTheRealPlansAlone' -count=1

      - name: Install Playwright and screenshot
        run: |
          set -eu
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
          # Only the two showcase scenarios.
          SCREENSHOT_SCENARIOS=simple,complex node scripts/screenshot.mjs docs/smoke docs/screenshots
          ls -la docs/screenshots

      - name: Post markdown reports and screenshots on the PR
        if: env.CAN_COMMENT == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            async function upsert(tag, body) {
              const mark = `<!-- smoke-${tag} -->`;
              const full = `${mark}\n${body}`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const existing = comments.find((c) => c.body && c.body.startsWith(mark));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body: full });
              }
            }

            // (a) the markdown report of each scenario, verbatim. The report
            // starts with its own hidden marker, so each scenario gets its own
            // comment keyed by scenario name.
            for (const scenario of ['simple', 'complex']) {
              let md = fs.readFileSync(path.join('docs/smoke', scenario, 'report.md'), 'utf8');
              if (md.length > 60000) md = md.slice(0, 60000);
              await upsert(`report-${scenario}`, `**Smoke test: \`${scenario}\` scenario, tfplanlens markdown report (verbatim)**\n\n${md}`);
            }

            // (b) screenshots are not committed any more: point at this run's artifact.
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await upsert('screenshots', [
              '**Smoke test: HTML report screenshots**', '',
              `The screenshots (desktop, phone and detail drawers for \`simple\` and \`complex\`) and every rendered report are in the \`smoke-outputs\` artifact of [this run](${run}).`, '',
              'Nothing is committed back to the branch. To refresh the committed plans and reports, run `scripts/smoke-refresh.sh` and commit the result.',
            ].join('\n'));

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-outputs
          path: |
            testdata/plans/real
            docs/smoke
            docs/screenshots
